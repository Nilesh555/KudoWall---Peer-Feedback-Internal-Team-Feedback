openapi: 3.0.3
info:
  title: Internal Team Feedback & Peer Kudos Wall API
  version: 1.0.0
  description: "RESTful API backend for employee recognition, peer kudos wall, emoji
    reactions, and monthly department leaderboard analytics.\n\n### Key Features\n*
    **Authentication**: JWT authentication with 15-minute access tokens and 7-day
    refresh tokens delivered via HTTP-only cookies with automatic rotation and blacklisting.\n*
    **Users & Profiles**: Complete user directory, autocomplete search for peer recognition,
    and personal profile analytics.\n* **Kudos Feed & Transfer**: Atomic points transfer
    with database row locking (SELECT FOR UPDATE) preventing race conditions and negative
    allowances.\n* **Reactions**: Interactive emoji reactions (+1, \U0001F44F, \U0001F525)
    with toggle support.\n* **Leaderboard**: Real-time monthly rankings calculated
    through database-level ORM aggregation with department filtering."
paths:
  /api/accounts/departments/:
    get:
      operationId: accounts_departments_list
      description: Retrieves a list of all company departments with user counts.
      summary: List all departments
      tags:
      - Departments
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Department'
          description: ''
  /api/accounts/departments/{id}/:
    get:
      operationId: accounts_departments_retrieve
      description: Retrieves specific department information by its primary key ID.
      summary: Retrieve department details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/accounts/forgot-password/:
    post:
      operationId: accounts_forgot_password_create
      description: Generates a password reset token for the given registered email
        address.
      summary: Request password reset token (simulation)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticates credentials and issues a short-lived (15m) access
        token and long-lived (7d) refresh token set in an HTTP-only cookie.
      summary: User login with JWT and HTTP-only cookies
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/accounts/logout/:
