  /api/kudos/:
    get:
      operationId: kudos_list
      description: Retrieves a paginated feed of kudos ordered from newest to oldest.
        Pre-fetches sender/receiver profiles and reactions to avoid N+1 database queries.
        Optimized for React infinite scroll.
      summary: Retrieve Company Kudos Feed
      parameters:
      - in: query
        name: company_value
        schema:
          type: string
        description: Filter kudos by company value (Teamwork, CustomerObsession, Innovation)
      - in: query
        name: department_id
        schema:
          type: integer
        description: Filter kudos by receiver department ID
      - in: query
        name: page
        schema:
          type: integer
        description: Page number for infinite scroll pagination
      - in: query
        name: receiver_id
        schema:
          type: integer
        description: Filter kudos received by specific user ID
      - in: query
        name: sender_id
        schema:
          type: integer
        description: Filter kudos sent by specific user ID
      tags:
      - Kudos
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KudosRead'
          description: ''
    post:
      operationId: kudos_create
      description: Awards a Kudo from the authenticated sender to a peer receiver.
        Executes within a PostgreSQL database transaction with row-level locks (SELECT
        FOR UPDATE) to guarantee atomic balance deduction, point crediting, kudo record
        creation, and ledger logging.
      summary: Give Kudos (Atomic Points Transfer)
      tags:
      - Kudos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KudosCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KudosCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KudosCreateRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KudosRead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/kudos/{kudos_id}/reactions/:
    get:
      operationId: kudos_reactions_retrieve
      description: Returns reaction counts and the authenticated user's current reactions
        on this Kudo.
      summary: Get reaction summary for a Kudo
      parameters:
      - in: path
        name: kudos_id
        schema:
          type: integer
        required: true
      tags:
      - Reactions
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: kudos_reactions_create
      description: "Adds a reaction (+1, \U0001F44F, \U0001F525) to a specific Kudo.
        Enforces uniqueness so a user cannot duplicate the same emoji."
      summary: Add an emoji reaction to a Kudo
      parameters:
      - in: path
        name: kudos_id
        schema:
          type: integer
        required: true
      tags:
      - Reactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReactionActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReactionActionRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: kudos_reactions_destroy
      description: Removes the user's previously submitted emoji reaction from the
        Kudo.
      summary: Remove an emoji reaction from a Kudo
      parameters:
      - in: path
        name: kudos_id
        schema:
          type: integer
        required: true
      - in: query
        name: reaction_type
        schema:
          type: string
        description: "Emoji symbol to remove (+1, \U0001F44F, \U0001F525)"
      tags:
      - Reactions
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/kudos/{id}/:
    get:
      operationId: kudos_retrieve
      description: Retrieves specific kudos message details including sender, receiver,
