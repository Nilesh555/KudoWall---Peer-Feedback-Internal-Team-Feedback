          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/accounts/users/:
    get:
      operationId: accounts_users_list
      description: Retrieves paginated team members. Designed for Give Kudos modal
        autocomplete and member search. Supports search by name/email, department
        filtering, and auto-excludes authenticated sender.
      summary: List / Search team members (User Autocomplete)
      parameters:
      - in: query
        name: department
        schema:
          type: string
        description: Filter by department name (Engineering, Design, etc.) or department
          ID
      - in: query
        name: exclude_self
        schema:
          type: boolean
        description: 'Exclude the currently authenticated user from results (default:
          true in modal)'
      - in: query
        name: page
        schema:
          type: integer
        description: Page number for pagination
      - in: query
        name: search
        schema:
          type: string
        description: Search query matching user name or email (e.g., "Alice" or "bob@")
