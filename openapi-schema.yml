          description: ''
    post:
      operationId: reactions_create
      description: "Adds a reaction (+1, \U0001F44F, \U0001F525) to a specific Kudo.
        Enforces uniqueness so a user cannot duplicate the same emoji."
      summary: Add an emoji reaction to a Kudo
      parameters:
