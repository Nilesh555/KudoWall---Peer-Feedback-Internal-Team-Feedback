  /api/leaderboard/:
    get:
      operationId: leaderboard_retrieve
      description: Ranks active users based on earned Kudos points for the selected
        or current calendar month. Supports department filtering (Engineering, Design,
        Marketing, Sales). Uses efficient database-level aggregation to prevent N+1
        queries.
      summary: Get Monthly Kudos Leaderboard
      parameters:
      - in: query
        name: department
        schema:
          type: string
        description: Filter by department name (e.g., Engineering, Design, Marketing,
          Sales) or department ID
      - in: query
        name: month
        schema:
          type: integer
        description: Month number (1-12). Defaults to current month.
      - in: query
        name: year
        schema:
          type: integer
        description: 4-digit year (e.g., 2026). Defaults to current year.
      tags:
      - Leaderboard
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
