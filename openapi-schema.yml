          description: ''
  /api/accounts/token/refresh/:
    post:
      operationId: accounts_token_refresh_create
      description: Reads the refresh token from the HTTP-only cookie or request body,
        blacklists the old refresh token, rotates a new refresh token into the cookie,
        and returns a new access token.
      summary: Refresh access token with refresh-token rotation
      tags:
